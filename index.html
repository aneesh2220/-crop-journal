<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143d25" />

    <title>AgroAI — Free AI Farming Assistant for Indian Farmers</title>
    <meta
      name="description"
      content="AgroAI is a free AI farming assistant for Indian farmers — crop disease diagnosis from a photo, soil health analysis, crop suggestions, irrigation advice, weather forecasts and daily mandi market prices, in 23 Indian languages."
    />
    <meta
      name="keywords"
      content="AgroAI, AI farming assistant, crop doctor, soil health, mandi prices, kisan app, Indian farmers, crop disease detection, irrigation advisor, agriculture AI"
    />
    <link rel="canonical" href="https://agroai-five.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="AgroAI" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgroAI" />
    <meta property="og:title" content="AgroAI — Free AI Farming Assistant for Indian Farmers" />
    <meta
      property="og:description"
      content="Crop disease diagnosis from a photo, soil analysis, weather, irrigation advice and daily mandi prices — free, in 23 Indian languages, on any phone."
    />
    <meta property="og:url" content="https://agroai-five.vercel.app/" />
    <meta property="og:image" content="https://agroai-five.vercel.app/og-image.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgroAI — Free AI Farming Assistant for Indian Farmers" />
    <meta
      name="twitter:description"
      content="Crop disease diagnosis from a photo, soil analysis, weather, irrigation advice and daily mandi prices — free, in 23 Indian languages."
    />
    <meta name="twitter:image" content="https://agroai-five.vercel.app/og-image.png" />

    <!-- Structured data: tells Google this is a named product called AgroAI, which is
         what makes a brand-name search resolve to this site rather than a generic match. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AgroAI",
        "alternateName": "AgroAI Smart Farming Assistant",
        "url": "https://agroai-five.vercel.app/",
        "description": "AgroAI is a free AI-powered farming assistant for Indian farmers offering crop disease diagnosis, soil health analysis, crop suggestions, irrigation advice, weather forecasts and daily mandi market prices in 23 Indian languages.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["en", "hi", "bn", "mr", "te", "ta", "gu", "kn", "ml", "or", "pa", "as", "ur"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "featureList": [
          "AI farming assistant chat",
          "Crop Doctor disease diagnosis from photos",
          "Soil health analyser",
          "Best crop suggestions",
          "Irrigation advisor",
          "Weather forecast",
          "Mandi market prices",
          "Farm progress and task tracking"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is AgroAI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AgroAI is a free, AI-powered farming assistant built for Indian farmers. It brings crop health guidance, soil analysis, weather, irrigation advice, mandi market prices and simple farm record-keeping together in one web app that works on any phone."
            }
          },
          {
            "@type": "Question",
            "name": "Does AgroAI cost anything?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. AgroAI is free to use. There is no subscription and no payment required."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to create an account to use AgroAI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. You can continue as a guest and use the AI assistant, Crop Doctor, Soil Health, Crop Suggestions, Irrigation, Weather and Market Watch. An account is only needed to save your farm profile, track crop progress and keep task reminders."
            }
          },
          {
            "@type": "Question",
            "name": "Which languages does AgroAI support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AgroAI works in 23 languages including Hindi, Bengali, Marathi, Telugu, Tamil, Gujarati, Kannada, Malayalam, Odia, Punjabi, Assamese, Urdu and English. The AI assistant replies in whichever language you write in."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Server-rendered fallback text. The React app replaces this on mount; it exists so
           a crawler (or a visitor with JS disabled) sees real content instead of an empty div. -->
      <noscript>
        <h1>AgroAI — Free AI Farming Assistant for Indian Farmers</h1>
        <p>
          AgroAI is a free AI-powered farming assistant for Indian farmers. Diagnose crop disease
          from a photo, analyse soil health, get crop and irrigation recommendations, check the
          weather for your farm, and see daily mandi market prices — in 23 Indian languages, on any
          phone, with nothing to install.
        </p>
        <p><a href="/about">Learn more about AgroAI</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
