      <stop offset="0%" stop-color="#e0a527" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e0a527" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#4a9c60" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4a9c60" stop-opacity="0"/>
